spring.application.name=auth-service
spring.threads.virtual.enabled=true
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/postgresql

jwt.expiration-seconds=86400

auth.master-key=${AUTH_MASTER_KEY:dev-master-key-change-in-production}

# Contador do rate limit de POST /api/auth/token (@RateLimit no TokenController).
# Mesmo default dev-safe do chat-service. Em prod NAO tem default: ver application-prod.properties.
spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
