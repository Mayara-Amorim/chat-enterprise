# ============================================
# Producao valores injetados via env vars
# ============================================

# Logging restritivo
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
spring.jpa.show-sql=false

# Database (Neon DB)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP  pool menor para serverless
spring.datasource.hikari.maximum-pool-size=5

# Flyway apenas PostgreSQL em prod
spring.flyway.locations=classpath:db/migration/postgresql

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Rate limit: placeholder SEM default, igual ao chat-service. Se SPRING_REDIS_URL faltar, o boot
# falha em vez de cair silenciosamente em localhost:6379 — que em Cloud Run recusaria conexao e
# faria TODA emissao de token falhar-aberto, com um WARN por chamada. Falha alta na hora do deploy
# e melhor que protecao ausente em silencio.
spring.data.redis.url=${SPRING_REDIS_URL}
