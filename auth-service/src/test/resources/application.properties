spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
auth.master-key=test-master-key
jwt.expiration-seconds=3600
# Sem isto os testes de /api/auth/token tentariam falar com um Redis inexistente e pagariam o
# timeout de conexao a cada chamada. O comportamento do limitador e coberto por
# RateLimitInterceptorTest, no shared-kernel, sem infraestrutura.
ratelimit.enabled=false
