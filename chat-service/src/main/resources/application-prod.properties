# ============================================
# Producao valores injetados via env vars
# ============================================

# Logging restritivo
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
spring.jpa.show-sql=false

# Database (Neon DB)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP  pool menor para serverless
spring.datasource.hikari.maximum-pool-size=5

# Flyway apenas PostgreSQL em prod
spring.flyway.locations=classpath:db/migration/postgresql

# Kafka (Confluent Cloud SASL/SSL)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}

# Redis (Upstash)
spring.data.redis.url=${SPRING_REDIS_URL}

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
