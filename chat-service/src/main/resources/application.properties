spring.application.name=chat-service
spring.threads.virtual.enabled=true
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=chat-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

# OTLP metrics export (Fatia A - observabilidade). Gate desligado por default;
# prod liga com fail-fast (application-prod.properties). Ver spec 2026-07-28-observabilidade.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.aggregation-temporality=cumulative
# URL/credencial ficam na base (e nao so no profile prod) para que dev consiga apontar para o
# Grafana Cloud ao validar (spec 3.3 e passos 4-5 da secao 9). Defaults dev-safe: sem as env vars,
# o registry aponta para o default do Micrometer e nao vaza credencial. O prod SOBRESCREVE as duas
# com placeholder SEM default (application-prod.properties) — e dai que vem o fail-fast do criterio 7.
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${OTLP_AUTH_HEADER:}

# Corte de cardinalidade (spec secao 3.5.1). MEDIDO, nao estimado: payload por push cai de
# 103.383 para 36.954 bytes (-64%), e mais numa instancia de vida longa, onde as
# kafka.consumer.node.* (as que mais pesam) ja nasceram.
#
# O PropertiesMeterFilter resolve pelo prefixo MAIS ESPECIFICO, entao a segunda linha reabilita
# fetch.manager dentro do prefixo negado. As duas linhas andam JUNTAS:
# sem a segunda, kafka.consumer.fetch.manager.records.lag some e os dois paineis de consumer lag
# ficam vazios em silencio. Protegido por OtlpFailFastConfigTest.
#
# O que se perde: coordinator (rebalance/heartbeat), node (por broker), conexao e autenticacao.
# FATIA B: rebalance e o comportamento central de "consumer group por instancia" — reabilitar
# management.metrics.enable.kafka.consumer.coordinator=true enquanto durar aquele trabalho.
management.metrics.enable.kafka.consumer=false
management.metrics.enable.kafka.consumer.fetch.manager=true
management.opentelemetry.resource-attributes.service.name=chat-service
management.opentelemetry.resource-attributes.service.instance.id=${INSTANCE_ID:${random.uuid}}
management.opentelemetry.resource-attributes.deployment.environment=${SPRING_PROFILES_ACTIVE:dev}

# File Upload
file-upload.max-size-bytes=26214400
file-upload.max-attachments-per-message=10
file-upload.signed-url-ttl-minutes=15
file-upload.download-url-ttl-minutes=60
file-upload.gcs-bucket=${GCS_BUCKET:chat-dev-attachments}
file-upload.allowed-content-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,audio/mpeg,audio/ogg,video/mp4,video/webm,application/zip,application/x-rar-compressed
