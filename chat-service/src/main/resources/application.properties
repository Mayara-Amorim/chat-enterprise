spring.application.name=chat-service
spring.threads.virtual.enabled=true
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/{vendor}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=chat-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

# File Upload
file-upload.max-size-bytes=26214400
file-upload.max-attachments-per-message=10
file-upload.signed-url-ttl-minutes=15
file-upload.download-url-ttl-minutes=60
file-upload.gcs-bucket=${GCS_BUCKET:chat-dev-attachments}
file-upload.allowed-content-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,audio/mpeg,audio/ogg,video/mp4,video/webm,application/zip,application/x-rar-compressed
